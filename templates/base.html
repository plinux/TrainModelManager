<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}火车模型管理系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
  <nav>
    <ul>
      <li><a href="{{ url_for('main.index') }}">首页</a></li>
      <li><a href="{{ url_for('locomotive.locomotive') }}">机车模型</a></li>
      <li><a href="{{ url_for('carriage.carriage') }}">车厢模型</a></li>
      <li><a href="{{ url_for('trainset.trainset') }}">动车组模型</a></li>
      <li><a href="{{ url_for('locomotive_head.locomotive_head') }}">先头车模型</a></li>
      <li><a href="{{ url_for('options.options') }}">信息维护</a></li>
      <li><a href="{{ url_for('system.system') }}">系统维护</a></li>
    </ul>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Core modules (order matters: dependencies declared earlier) -->
  <script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/dropdowns.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/tables.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/forms.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/file_manager.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/compat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
  <script>
  // CSRF：所有 POST 表单自动注入 csrf_token，所有 POST fetch 自动带 X-CSRFToken
  (function() {
    var meta = document.querySelector('meta[name="csrf-token"]');
    if (!meta) return;
    var token = meta.content;
    document.addEventListener('submit', function(e) {
      var form = e.target;
      if ((form.method || '').toUpperCase() === 'POST' && !form.querySelector('[name=csrf_token]')) {
        var input = document.createElement('input');
        input.type = 'hidden'; input.name = 'csrf_token'; input.value = token;
        form.appendChild(input);
      }
    }, true);
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      opts = opts || {};
      if (token && (opts.method || 'GET').toUpperCase() === 'POST') {
        opts.headers = Object.assign({}, opts.headers || {}, {'X-CSRFToken': token});
      }
      return origFetch.call(this, url, opts);
    };
  })();
  </script>
</body>
</html>
